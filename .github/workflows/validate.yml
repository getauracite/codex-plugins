name: Validate plugin package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifest and package
        shell: pwsh
        run: ./plugins/auracite-agent-hub/scripts/validate-plugin.ps1
      - name: Test JSON-RPC bridge
        shell: pwsh
        run: node ./plugins/auracite-agent-hub/scripts/test-jsonrpc-bridge.mjs
